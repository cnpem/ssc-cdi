variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_UPDATE_FLAGS: --remote
  RUNNER_TAG: "podman"

stages:
- build
- deploy
- documentation

build_sdist:
  stage: build
  image: gccdockers/python-builder
  script:
  - python3 -m build --sdist
  tags:
  - "$RUNNER_TAG"
  artifacts:
    paths:
    - ./dist/*tar.gz
    expire_in: 1 day

deploy_sdist:
  stage: deploy
  image: gccdockers/python-builder
  script:
  - twine upload ./dist/*.tar.gz  --repository-url="$GCC_PYPI_HOST"
  tags:
  - docker
  dependencies:
  - build_sdist
  only:
  - "$RUNNER_TAG"

pages:
  stage: documentation
  image: python:3.12
  before_script:
  - pip install -r docs/requirements.txt
  script:
  - sphinx-build -j $(nproc) -b html docs/ public/
  artifacts:
    paths:
    - public
  only:
  - master
  tags:
  - "$RUNNER_TAG"
