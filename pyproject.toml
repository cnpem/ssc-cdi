[build-system]
requires = [
    "setuptools>=61.0",
    "scikit-build>=0.17",
    "cmake>=3.24",
    "ninja==1.11.1.1",
    "wheel>=0.45.0",
]
build-backend = "setuptools.build_meta"

[project]
dynamic = ["version"]
name = "sscCdi"
license = { file = "LICENSE" }
readme = "README.md"

requires-python = ">=3.7"

dependencies = [
  'numpy',
  'matplotlib',
  'h5py',
  'scipy',
  'scikit-image >=0.19.3',
  'tqdm',
  'ipywidgets',
  'SharedArray',
  'cupy >= 14.1.1'
]

classifiers=[
    'Development Status :: 4 - Beta', 
    'Intended Audience :: Science/Research', 
    'Intended Audience :: Education', 
    'Intended Audience :: Developers',
    'Natural Language :: English', 
    'Programming Language :: Python',
    'Programming Language :: C', 
    'Programming Language :: C++'
]
authors = [
  {name = "Yuri R. Tonin"},
  {name = "Giovanni Baraldi"},
  {name = "Eduardo X. Miqueles", email = "eduardo.miqueles@lnls.br"},
  {name = "Alan Peixinho"},
  {name = "Leonardo M. Corrêa", email = "leonardo.correa@lnls.br"},
  {name = "Lucas Antonio Pelike", email = "lucas.pelike@lnls.br"},
  {name = "Paola Ferraz", email = "paola.ferraz@lnls.br"},
  {name = "Matthew R. C. Fitzpatrick", email = "matthew.fitzpatrick@lnls.br"}
]

maintainers = [
  {name = "Leonardo M. Corrêa", email = "leonardo.correa@lnls.br"},
  {name = "Lucas Antonio Pelike", email = "lucas.pelike@lnls.br"},
  {name = "Paola Ferraz", email = "paola.ferraz@lnls.br"},
  {name = "Matthew R. C. Fitzpatrick", email = "matthew.fitzpatrick@lnls.br"}
]

description = "Sirius Coherent Diffraction Imaging Package"

keywords = ["Ptychography", "Tomography", "Imaging"]

[project.urls]
Homepage = "https://github.com/cnpem/ssc-cdi/"
Documentation = "https://github.com/cnpem/ssc-cdi/master/docs/build/index.html"
Repository = "https://github.com/cnpem/ssc-cdi.git"
Issues = "https://github.com/cnpem/ssc-cdi/issues"
Changelog = "https://github.com/cnpem/ssc-cdi/master/CHANGES.rst"


[tool.setuptools]
platforms = ["Linux"]

[tool.setuptools.dynamic]
version = {attr = "sscCdi._version.__version__"}
